version: 2

sources:

  - name: google_sheets # name of the source 
    schema: google_sheet # this is the schema our raw data lives in
    database: DB02_BRONZE_DB # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    config:
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:

      - name: budget
        description: "Tabla que viene de google sheets de presupuestos"
        config:
          loaded_at_field: _FIVETRAN_SYNCED
        columns:
          - name: _row
            description: "Número de línea"
            data_tests:
              - unique
              - not_null
          - name: product_id
            description: "Id del producto"
            data_tests:
              - not_null
          - name: quantity
            description: "Cantidad"
          - name: month
            description: "Mes de compra"
          - name: _fivetran_synced
            description: "Fecha cuando se ha creado la fila"

      - name: users
        description: "Tabla de usuarios de google sheet"
        columns:
          - name: Nombre
            description: "Nombre del usuario"
          - name: DNI
            description: "DNI del usuario"
            data_tests:
              - unique
          - name: email
            description: "Correo electrónico del usuario"
          - name: fecha_alta_sistema
            description: "Fecha de alta en el sistema del usuario"